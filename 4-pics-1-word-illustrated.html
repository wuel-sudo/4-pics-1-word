<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4 Pics 1 Word</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0e1538;--bg2:#243a8a;--amber:#ffc23c;--mint:#3ddc97;--red:#ff5d6c;--ink:#0b1030;--tile:#f4f0ff;--w:min(100vw,560px);--g:clamp(220px,calc(100dvh - 430px),min(92vw,540px));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 0,var(--bg2),var(--bg1) 70%) fixed;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}
#app{width:var(--w);margin:0 auto;padding:10px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:100dvh}
header{width:100%;display:flex;justify-content:space-between;align-items:center}
.pips{display:flex;gap:8px;align-items:center;font-weight:700}
.pip{width:14px;height:14px;border-radius:50%;background:#ffffff30;transition:.3s}
.pip.on{background:var(--amber);transform:scale(1.35)}.pip.done{background:var(--mint)}
.score{font-size:18px;background:#ffffff1c;padding:6px 14px;border-radius:999px}.score b{color:var(--amber);font-size:22px;display:inline-block}
.score b.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.6)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:var(--g);height:var(--g);transition:.4s}
.grid.out{opacity:0;transform:translateX(-40px)}
.ph{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(110deg,#1a2660 30%,#2c3d8f 50%,#1a2660 70%) 0 0/200% 100%;animation:sh 1.4s linear infinite,rise .5s both;box-shadow:0 6px 18px #0006}
@keyframes sh{to{background-position:-200% 0}}@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.ph.ok{animation:rise .5s both}.ph.ok img{opacity:1}
.ph.fail::after{content:"Photo unavailable";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#9fb0ff;text-align:center}
.ph.fail{animation:none}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;--n:5}
.slot{width:min(50px,calc((var(--w) - 28px)/var(--n) - 6px));aspect-ratio:1;border-radius:10px;background:#ffffff20;border:2px dashed #ffffff55;color:var(--ink);font-weight:700;font-size:clamp(18px,5.4vw,28px);padding:0;display:flex;align-items:center;justify-content:center}
.slot.f{background:var(--tile);border:2px solid var(--tile);animation:pop .15s}
.slot.lk{background:var(--amber);border-color:var(--amber)}
.slot.good{background:var(--mint);border-color:var(--mint);animation:hop .6s both}
.slots.bad .slot.f:not(.lk){background:var(--red);border-color:var(--red);color:#fff;animation:shk .45s}
@keyframes pop{50%{transform:scale(1.15)}}@keyframes hop{40%{transform:translateY(-16px) scale(1.12)}}@keyframes shk{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.msg{height:26px;font-weight:700;font-size:18px;text-align:center}.msg.ok{color:var(--mint)}.msg.no{color:#ff9aa4}
.tools{display:flex;gap:12px}
.tool{min-width:110px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:16px;color:var(--ink);background:var(--amber);box-shadow:0 4px 0 #b98410}
.tool.alt{background:#c9d3ff;box-shadow:0 4px 0 #6c7cc8}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #0006}.tool:disabled{opacity:.45}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.tile{width:min(52px,calc((var(--w) - 28px)/7 - 8px));aspect-ratio:1;border-radius:12px;background:var(--tile);color:var(--ink);font-weight:700;font-size:clamp(20px,6vw,30px);box-shadow:0 4px 0 #8f86c9;padding:0}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #8f86c9}
.tile.used{visibility:hidden}
.foot{font-size:11px;color:#8da0ff;text-align:center;margin-top:auto}
#win{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px;background:radial-gradient(ellipse at 50% 30%,#3b55c9,#0e1538 75%);z-index:10}
#win.on{display:flex;animation:rise .6s}
#win h1{margin:0;font-size:clamp(34px,9vw,60px);color:var(--amber)}
#win .big{font-size:clamp(46px,14vw,90px);font-weight:700}
.stars{display:flex;gap:10px}.star{width:54px;height:52px;background:#ffffff30;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.star.on{background:var(--amber);animation:pop .5s both}
.go{min-height:56px;padding:0 36px;border-radius:16px;font-weight:700;font-size:20px;color:var(--ink);background:var(--mint);box-shadow:0 5px 0 #1f9a68}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #1f9a68}
.cf{position:fixed;left:50%;top:40%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:20;animation:cf 1.1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
@media (max-height:700px){:root{--g:clamp(180px,calc(100dvh - 400px),min(92vw,540px))}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body>
<div id="app">
 <header><div class="pips" id="pips"></div><div class="score">SCORE <b id="score">0</b></div></header>
 <div class="grid" id="grid"></div>
 <div class="slots" id="slots"></div>
 <div class="msg" id="msg"></div>
 <div class="tools"><button class="tool" id="hint">HINT (2)</button><button class="tool alt" id="clear">CLEAR</button></div>
 <div class="tiles" id="tiles"></div>
 <div class="foot">Pictures drawn for this game</div>
</div>
<div id="win"><h1>YOU DID IT!</h1><div class="stars" id="stars"></div><div>FINAL SCORE</div><div class="big"><span id="fs">0</span><small style="font-size:.35em"> / 300</small></div><button class="go" id="again">PLAY AGAIN</button></div>
<script>
/* ===== PHOTOS: each picture lists a main URL first, then backups used automatically if it fails ===== */
const pex=id=>`https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=800`;
const uns=id=>`https://unsplash.com/photos/${id}/download?force=true&w=800`;
const S=(b,a='#9ad8ff',z='#e8f6ff')=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${z}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/>${b}</svg>`);
const cl=(x,y,s,c='#fff')=>`<g fill="${c}" transform="translate(${x} ${y}) scale(${s})"><circle r="8"/><circle cx="9" cy="2" r="7"/><circle cx="-9" cy="3" r="6"/><rect x="-14" y="2" width="30" height="8" rx="4"/></g>`;
const st=(n,c='#fff')=>Array.from({length:n},(_,i)=>`<circle cx="${(i*37+11)%96+2}" cy="${(i*23+7)%55+3}" r="${i%3?.8:1.4}" fill="${c}"/>`).join('');
const EMBED=[[
 S(`${cl(25,20,1)}${cl(75,14,.8)}<rect y="78" width="100" height="22" fill="#c9a36b"/>`+[0,0,6,22,45,68].map((a,i)=>`<rect x="-3.5" y="-24" width="7" height="24" rx="1.5" fill="#fff" stroke="#222" stroke-width="1.2" transform="translate(${14+i*14} 78) rotate(${a})"/><circle cx="${14+i*14}" cy="${66}" r="0"/>`).join('')),
 S(`<rect x="45" y="48" width="10" height="52" fill="#444"/><rect x="30" y="6" width="40" height="52" rx="8" fill="#1d1d1d"/><circle cx="50" cy="21" r="9" fill="#ff3b3b"/><circle cx="50" cy="38" r="9" fill="#4a3f10"/><circle cx="50" cy="55" r="0"/><rect y="90" width="100" height="10" fill="#333"/>`,'#2b3a6b','#8aa0d8'),
 S(`${cl(50,14,1.6,'#7d8aa3')}${Array.from({length:14},(_,i)=>`<line x1="${12+i*6}" y1="${30+i%3*6}" x2="${9+i*6}" y2="${38+i%3*6}" stroke="#3a7bd5" stroke-width="1.2"/>`).join('')}<path d="M18 62 Q50 22 82 62 Z" fill="#e63946"/><line x1="50" y1="42" x2="50" y2="84" stroke="#333" stroke-width="2"/><ellipse cx="50" cy="94" rx="34" ry="5" fill="#5b8bd9"/>`,'#8d99ae','#cfd8e3'),
 S(`<circle cx="80" cy="20" r="11" fill="#ffd23f"/>${[0,45,90,135,180,225,270,315].map(a=>`<line x1="80" y1="20" x2="80" y2="3" stroke="#ffd23f" stroke-width="2" transform="rotate(${a} 80 20)"/>`).join('')}<rect x="22" y="48" width="30" height="28" rx="4" fill="#bfe9ff" stroke="#6ab7e8" stroke-width="2"/><rect y="84" width="100" height="16" fill="#8d7b68"/><ellipse cx="38" cy="86" rx="28" ry="6" fill="#4aa3df"/><circle cx="60" cy="68" r="2" fill="#4aa3df"/><circle cx="62" cy="76" r="2" fill="#4aa3df"/>`,'#bfe8ff','#fff6d6')
],[
 S(`<rect x="62" y="8" width="26" height="30" fill="#bfe6ff" stroke="#fff" stroke-width="3"/><circle cx="75" cy="20" r="6" fill="#ffd23f"/><rect y="62" width="100" height="38" fill="#9a6a3c"/><ellipse cx="42" cy="74" rx="26" ry="9" fill="#fff"/><circle cx="42" cy="73" r="7" fill="#ffd23f"/><rect x="72" y="58" width="14" height="14" rx="2" fill="#e8e8f0"/><path d="M86 62q6 0 6 5t-6 5" fill="none" stroke="#e8e8f0" stroke-width="2"/><path d="M76 52q-3-5 0-9M82 52q-3-5 0-9" stroke="#fff" stroke-width="1.5" fill="none"/>`,'#ffd9a8','#ffe9c8'),
 S(`${cl(22,16,.9)}<rect y="76" width="100" height="24" fill="#4a4a55"/><rect y="86" width="100" height="2" fill="#e8e8e8"/><rect x="22" y="40" width="64" height="32" rx="5" fill="#ffc300"/>${[28,44,60,74].map(x=>`<rect x="${x}" y="46" width="10" height="11" fill="#bfe6ff"/>`).join('')}<circle cx="38" cy="73" r="6" fill="#222"/><circle cx="72" cy="73" r="6" fill="#222"/><rect x="8" y="28" width="3" height="48" fill="#555"/><rect x="2" y="22" width="16" height="10" rx="2" fill="#1e6fd9"/><text x="10" y="30" font-size="7" font-weight="bold" fill="#fff" text-anchor="middle" font-family="Arial">BUS</text>`),
 S(`<rect y="70" width="100" height="30" fill="#c79a6b"/><rect x="12" y="12" width="76" height="38" rx="2" fill="#2f6f55" stroke="#8b5a2b" stroke-width="3"/><text x="50" y="38" font-size="18" fill="#fff" text-anchor="middle" font-family="Arial" font-weight="bold">A B C</text><rect x="12" y="62" width="30" height="5" fill="#8b5a2b"/><rect x="16" y="67" width="3" height="18" fill="#8b5a2b"/><rect x="36" y="67" width="3" height="18" fill="#8b5a2b"/><rect x="58" y="62" width="30" height="5" fill="#8b5a2b"/><rect x="62" y="67" width="3" height="18" fill="#8b5a2b"/><rect x="82" y="67" width="3" height="18" fill="#8b5a2b"/><circle cx="73" cy="57" r="5" fill="#e63946"/><rect x="24" y="52" width="14" height="10" fill="#4a90e2"/>`,'#fff1cf','#fff1cf'),
 S(`<rect y="30" width="100" height="3" fill="#b98b5e"/><rect y="58" width="100" height="3" fill="#b98b5e"/><path d="M20 62 H80 L72 92 H28 Z" fill="#b5793f"/><circle cx="36" cy="58" r="8" fill="#e63946"/><circle cx="52" cy="56" r="8" fill="#ffb703"/><rect x="62" y="38" width="14" height="24" fill="#fff" stroke="#4a90e2" stroke-width="2"/><ellipse cx="50" cy="48" rx="12" ry="7" fill="#d9a066"/><rect x="8" y="12" width="12" height="16" fill="#9be564"/><rect x="82" y="10" width="10" height="18" fill="#ff8fab"/>`,'#d8f3dc','#b7e4c7')
],[
 S(`${st(24)}${cl(20,86,1.4,'#e6dcff')}${cl(80,90,1.4,'#e6dcff')}<g transform="translate(50 52)"><ellipse cx="-17" cy="-2" rx="16" ry="7" fill="#fff" transform="rotate(-30 -17 -2)"/><ellipse cx="17" cy="-2" rx="16" ry="7" fill="#fff" transform="rotate(30 17 -2)"/><circle cy="-14" r="6" fill="#f2c9a0"/><path d="M-7 -6h14l4 20h-22z" fill="#ff8fab"/><rect x="-6" y="14" width="4" height="12" fill="#444"/><rect x="2" y="14" width="4" height="12" fill="#444"/></g>`,'#2b1b5e','#7a4fd6'),
 S(`${st(20)}<path d="M18 62 Q50 100 82 62 Z" fill="#7a5c3a"/><ellipse cx="50" cy="62" rx="32" ry="6" fill="#5fbf6e"/><rect x="34" y="38" width="32" height="24" fill="#e9e2ff"/><path d="M34 38v-12l5 4 5-8 6 8 5-8 5 8 6-4v12z" fill="#c9bfff"/><path d="M30 38l8-20 8 20zM54 38l8-20 8 20z" fill="#ff5d8f"/><rect x="46" y="48" width="8" height="14" rx="4" fill="#4a3a8a"/>${cl(18,40,.8,'#d9ccff')}${cl(86,34,.7,'#d9ccff')}`,'#4b2a8f','#c08fe0'),
 S(`${st(26)}<circle cx="80" cy="18" r="9" fill="#fff3b0"/><ellipse cx="46" cy="52" rx="30" ry="14" fill="#4aa3df"/><path d="M72 50q16-18 22-4q-8 0-10 8z" fill="#4aa3df"/><path d="M20 60q26 12 50 0v-5q-26 6-50 0z" fill="#d6efff"/><circle cx="30" cy="48" r="2.5" fill="#fff"/><circle cx="30" cy="48" r="1" fill="#111"/>${cl(25,88,1.5,'#e6dcff')}${cl(78,84,1.4,'#e6dcff')}`,'#0f1b4d','#3a56c4'),
 S(`${st(30)}<circle cx="72" cy="26" r="20" fill="#fff6c8"/><circle cx="66" cy="22" r="4" fill="#f0e3a0"/><circle cx="78" cy="32" r="3" fill="#f0e3a0"/>${[0,1,2,3,4,5].map(i=>`<rect x="${6+i*10}" y="${88-i*9}" width="10" height="${12+i*9}" fill="#d9ccff" stroke="#9b87e8" stroke-width="1"/>`).join('')}`,'#150f3f','#5a3fa8')
]];

const ROUNDS=[
 {word:'CONDITIONAL',alts:['Hand pushing dominoes in a chain reaction','Red traffic light','Woman with an umbrella in the rain','Ice melting in the sun'],
  photos:[[pex(12969405),pex(12969258)],[uns('IqB5MPcQp6k'),uns('PW1VyoGgIVc'),uns('bTzQ-NOVlS0')],[pex(28773241),pex(4005514),pex(15171377),pex(4555682)],[pex(12955678),pex(585293)]]},
 {word:'REAL',alts:['Family eating breakfast together','People waiting at a bus stop','Students and teacher in a classroom','Family sharing a meal at home'],
  photos:[[pex(5996979),pex(9885074),pex(12788659)],[pex(10574771),pex(19094729),pex(12179224)],[pex(5212331),pex(8617940),pex(5212326),pex(8617984)],[pex(7492954),pex(9885073)]]},
 {word:'UNREAL',alts:['Person levitating in a room','Castle shrouded in mist','Hot air balloons over rocky landscape','Hot air balloon among clouds'],
  photos:[[pex(1707821)],[pex(18993399),pex(18585433),pex(3358881),pex(5610971)],[pex(2325505),pex(17580520),pex(3023064)],[pex(1436129),pex(13767017),pex(21802697)]]}];
/* ======================================================================================== */
const $=id=>document.getElementById(id);
let r=0,score=0,hints=0,wrong=0,slots=[],tiles=[],lock=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function msg(t,c){const m=$('msg');m.textContent=t;m.className='msg '+(c||'')}
function load(){const R=ROUNDS[r],w=R.word;lock=false;hints=0;wrong=0;msg('');
 $('pips').innerHTML='<span>ROUND '+(r+1)+'/3</span>'+ROUNDS.map((_,i)=>'<i class="pip '+(i<r?'done':i===r?'on':'')+'"></i>').join('');
 const g=$('grid');g.innerHTML='';g.classList.remove('out');
 R.photos.forEach((c0,i)=>{const c=(typeof EMBED!=='undefined'&&EMBED[r]&&EMBED[r][i])?[EMBED[r][i]]:c0;const d=document.createElement('div'),img=new Image();let k=0;d.className='ph';d.style.animationDelay=i*90+'ms';img.alt=R.alts[i];img.referrerPolicy='no-referrer';
  img.onerror=()=>{k++;if(k<c.length)img.src=c[k];else{d.classList.add('fail');img.remove()}};img.onload=()=>d.classList.add('ok');img.src=c[0];d.appendChild(img);g.appendChild(d)});
 slots=[...w].map(()=>({t:null,lk:false}));$('slots').style.setProperty('--n',w.length);
 const L=[...w],total=w.length>8?14:12,A='ABCDEFGHIJKLMNOPQRSTUVWXYZ';while(L.length<total)L.push(A[Math.floor(Math.random()*26)]);
 tiles=shuffle(L.map(ch=>({ch})));tiles.forEach((t,i)=>t.id=i);
 $('hint').disabled=false;$('hint').textContent='HINT (2)';render()}
const used=id=>slots.some(s=>s.t===id);
function render(){const S=$('slots');S.className='slots';S.innerHTML='';
 slots.forEach((s,i)=>{const b=document.createElement('button');b.className='slot'+(s.t!==null?' f':'')+(s.lk?' lk':'');b.textContent=s.t!==null?tiles[s.t].ch:'';b.setAttribute('aria-label','Answer letter '+(i+1));
  b.onclick=()=>{if(lock||s.t===null||s.lk)return;s.t=null;msg('');render()};S.appendChild(b)});
 const T=$('tiles');T.innerHTML='';tiles.forEach(t=>{const b=document.createElement('button');b.className='tile'+(used(t.id)?' used':'');b.textContent=t.ch;
  b.onclick=()=>{if(lock)return;const i=slots.findIndex(s=>s.t===null);if(i<0)return;slots[i].t=t.id;msg('');render();if(slots.every(s=>s.t!==null))check()};T.appendChild(b)})}
function check(){const w=ROUNDS[r].word;if(slots.map(s=>tiles[s.t].ch).join('')===w)return win();
 wrong++;lock=true;$('slots').classList.add('bad');msg('Not quite. Tap a letter to change it.','no');setTimeout(()=>{lock=false;$('slots').classList.remove('bad')},650)}
function win(){lock=true;const pts=Math.max(20,100-hints*20-wrong*10);score+=pts;const s=$('score');s.textContent=score;s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump');
 document.querySelectorAll('.slot').forEach((e,i)=>{e.classList.add('good');e.style.animationDelay=i*70+'ms'});msg('Correct! +'+pts,'ok');confetti();
 setTimeout(()=>{$('grid').classList.add('out')},1500);setTimeout(()=>{r++;r>=3?finish():load()},1900)}
function confetti(){const C=['#ffc23c','#3ddc97','#ff5d6c','#7ec8ff','#c9a4ff'];for(let i=0;i<30;i++){const e=document.createElement('i');e.className='cf';e.style.background=C[i%5];e.style.setProperty('--x',(Math.random()*500-250)+'px');e.style.setProperty('--y',(Math.random()*-300-40)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}}
$('hint').onclick=()=>{if(lock||hints>=2)return;const w=ROUNDS[r].word;const i=slots.findIndex((s,k)=>!s.lk&&(s.t===null||tiles[s.t].ch!==w[k]));if(i<0)return;
 let j=tiles.findIndex(t=>t.ch===w[i]&&!used(t.id));if(j<0){j=tiles.findIndex(t=>t.ch===w[i]&&slots.some(s=>s.t===t.id&&!s.lk));const k=slots.findIndex(s=>s.t===tiles[j].id);slots[k].t=null}
 slots[i].t=tiles[j].id;slots[i].lk=true;hints++;$('hint').textContent='HINT ('+(2-hints)+')';if(hints>=2)$('hint').disabled=true;msg('Hint used: one letter revealed.');render();if(slots.every(s=>s.t!==null))check()};
$('clear').onclick=()=>{if(lock)return;slots.forEach(s=>{if(!s.lk)s.t=null});msg('');render()};
function finish(){$('fs').textContent=score;$('stars').innerHTML=[0,1,2].map(i=>'<i class="star'+(score>=(i?(i>1?270:200):0)+(i?1:0)||i===0?' on':'')+'" style="animation-delay:'+i*250+'ms"></i>').join('');$('win').classList.add('on');confetti()}
$('again').onclick=()=>{score=0;r=0;$('score').textContent=0;$('win').classList.remove('on');load()};
load();
</script></body></html>
